<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo de productos naturales, suplementos orgánicos, infusiones y cuidado personal de Lastmen.">
    <title>Productos | Lastmen Medicina Natural</title>
    <link rel="icon" type="image/png" href="assets/img/iconlastmen.png">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

    <header class="header-principal" id="main-header">
        <div class="header-principal_brand">
            <a href="index.html">
                <img src="assets/img/logo-lastmen.jpg" alt="Lastmen Productos 100% Naturales" class="header-principal_logo">
            </a>
            <div class="header-principal_textos sr-only">
                <h1 class="header-principal_titulo">Lastmen</h1>
                <h2 class="header-principal_subtitulo">Productos 100% Naturales</h2>
            </div>
        </div>

        <nav class="navegacion" aria-label="Navegación Principal">
            <ul class="navegacion_lista">
                <li><a href="index.html" class="navegacion_enlace">Inicio</a></li>
                <li><a href="nosotros.html" class="navegacion_enlace">Nosotros</a></li>
                <li><a href="productos.html" class="navegacion_enlace navegacion_enlace-activo">Productos</a></li>
                <li><a href="contacto.html" class="navegacion_enlace">Contacto</a></li>
                <li>
                    <a href="carrito.html" class="navegacion_enlace" id="btn-ver-carrito">
                        <i class="fas fa-shopping-cart"></i> 
                        (<span id="contador-carrito">0</span>)
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="seccion-bloque" id="sec-catalogo">
        <h2 class="seccion-bloque_titulo">Catálogo de Productos Naturales</h2>
        <p class="seccion-contenedor_texto">Explora nuestra selección de productos elaborada para potenciar tu bienestar de forma 100% orgánica.</p>
        
        <!-- Filtros -->
        <div class="filtros-categoria" id="contenedor-filtros">
        </div>

        <div class="controles-catalogo">
            <div class="campo-busqueda">
                <i class="fas fa-search icono-busqueda"></i>
                <input 
                    type="text" 
                    id="input-buscar" 
                    placeholder="Buscar por producto o tratamiento..." 
                    class="input-control"
                    autocomplete="off"
                >
            </div>
            
            <div class="campo-ordenar">
                <label for="select-ordenar"><i class="fas fa-sort-amount-down"></i> Ordenar por:</label>
                <select id="select-ordenar" class="select-control">
                    <option value="defecto">Recomendados</option>
                    <option value="precio-menor">Precio: Menor a Mayor</option>
                    <option value="precio-mayor">Precio: Mayor a Menor</option>
                    <option value="nombre-az">Nombre: A - Z</option>
                </select>
            </div>
        </div>
        
        <div class="grid-productos-catalogo">

        </div>
    </main>

    <footer class="footer-principal" id="main-footer">
        <p class="footer-principal_copy">&copy; 2026 Lastmen Productos Naturales. Todos los derechos reservados.</p>
    </footer>
    <script src="js/data.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
